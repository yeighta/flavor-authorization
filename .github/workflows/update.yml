name: Update tobacco DB

on:
  schedule:
    # Fallback only. New PDFs normally start this workflow within ~10 minutes via
    # the Cloudflare Worker in watcher/ (workflow_dispatch); GitHub cron can lag hours.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # We commit back data/* so we need full history for non-fast-forward pushes.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # pdftoppm renders PDF pages to PNG for image-only extraction models (e.g. DeepSeek V4.1 Flash).
      - name: Install poppler-utils
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Refresh PDF URL list
        run: go run ./cmd/collect-urls -out data/pdf-urls.json

      - name: Scrape new PDFs (incremental, skips already-cached)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
        run: |
          # Limit per-run to bound runtime and cost.
          # Bootstrap (when cache is mostly empty) needs --limit 0 manually.
          go run ./cmd/scraper -limit 60 -rps 0.2

      - name: Classify newly-seen manufacturers
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: go run ./cmd/classify

      # 差分の有無を判定し、通知用に HEAD（old）のスナップショットを /tmp に保存しておく。
      # データブランチを切る前に取得するのがポイント（差分計算は cmd/notify が行う）。
      - name: Stage data and snapshot previous DB
        id: stage
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git show HEAD:data/products.json > /tmp/old_products.json 2>/dev/null || echo '[]' > /tmp/old_products.json
          git show HEAD:data/manufacturers.json > /tmp/old_manufacturers.json 2>/dev/null || echo '{}' > /tmp/old_manufacturers.json

      # main 直接 push を ruleset で禁止しているため、データブランチ → PR → 即時マージで反映する。
      - name: Open PR and merge
        if: steps.stage.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          BRANCH="data-update/${TS}"
          git checkout -b "$BRANCH"
          git commit -m "data: scheduled refresh (${TS})"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base ${{ github.ref_name }} \
            --head "$BRANCH" \
            --title "data: scheduled refresh (${TS})" \
            --body "Automated tobacco DB refresh.")
          gh pr merge "$PR_URL" --merge --delete-branch
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      # 通知を deploy より前に置く: deploy 発火が失敗しても通知は届くようにする。
      # 新規商品・価格改定・新規メーカーを Discord に、新規商品・価格改定の要約を X に投稿する。
      # 各 secret が未設定のチャネルはスキップ。通知失敗で deploy を止めないよう continue-on-error。
      - name: Notify Discord / X
        if: steps.stage.outputs.changed == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          go run ./cmd/notify \
            -old-products /tmp/old_products.json \
            -old-manufacturers /tmp/old_manufacturers.json \
            -pr-url "${{ steps.pr.outputs.pr_url }}"

      # GITHUB_TOKEN によるマージ commit は他ワークフローを連鎖発火させないため、
      # データ更新があった場合のみ deploy.yml を明示的に dispatch する。
      # 過去に dispatches API が HTTP 500 を返した実績があるため 3 回までリトライする。
      - name: Trigger frontend deploy
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            if gh workflow run deploy.yml --ref ${{ github.ref_name }}; then
              echo "dispatch ok"
              exit 0
            fi
            echo "dispatch failed (attempt $i), retrying in 10s..."
            sleep 10
          done
          echo "dispatch failed after 3 attempts"
          exit 1
